[package]
name = "waifu2x_repair"
version = "0.1.0"
edition = "2021"
description = "批量导入 PDF/图片, 用 unlimited:waifu2x 同款 ONNX 在本地修复"
license = "MIT"

[dependencies]
async-channel = "2"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest", "font-kit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
jpeg-encoder = "0.6"
png = "0.18"
pdf-writer = "0.13"
miniz_oxide = "0.8"
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_6406", "image", "thread_safe"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "2"
ureq = "2"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
sysinfo = "0.33"
rand = "0.8"
# Apple Silicon: 网页同款 WebGPU (Dawn→Metal) + CoreML.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
    "coreml",
    "webgpu",
] }

[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
    "directml",
    "lax-feature-matching",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "tls-native",
    "coreml",
] }

[profile.release]
lto = false
codegen-units = 16
opt-level = 3
strip = true

[profile.release-max]
inherits = "release"
lto = true
codegen-units = 1
