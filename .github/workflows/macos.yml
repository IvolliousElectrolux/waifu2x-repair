name: macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "挂到已有 Release 的标签; 留空只上传 artifact"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: macos-arm64
            pdfium: mac-arm64
          - target: x86_64-apple-darwin
            asset: macos-x64
            pdfium: mac-x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.asset }}
          cache-all-crates: true
          cache-provider: github
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build
        run: cargo build -r --target ${{ matrix.target }}

      - name: Bundle pdfium + onnxruntime
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          STAGE="waifu2x_repair-${VER}-${{ matrix.asset }}"
          BIN="target/${{ matrix.target }}/release/waifu2x_repair"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          chmod +x "$STAGE/waifu2x_repair"

          curl -fsSL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F6406/pdfium-${{ matrix.pdfium }}.tgz"
          mkdir -p pdfium-extract
          tar -xzf pdfium.tgz -C pdfium-extract
          DYLIB=$(find pdfium-extract -name 'libpdfium.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" "$STAGE/libpdfium.dylib"

          # ort copy-dylibs 把 onnxruntime 放到 target
          find "target/${{ matrix.target }}/release" -maxdepth 1 \( -name 'libonnxruntime*.dylib' -o -name 'libonnxruntime*' \) -exec cp {} "$STAGE/" \; || true
          find "target/${{ matrix.target }}/release/deps" -maxdepth 1 -name 'libonnxruntime*.dylib' -exec cp {} "$STAGE/" \; || true

          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "${STAGE}.zip"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ls -lh "${STAGE}.zip" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: ${{ env.STAGE }}.zip

      - name: Attach zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG=""
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "no release tag; skip attach"
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "waifu2x repair ${TAG}"
          fi
          gh release upload "$TAG" "${STAGE}.zip" --clobber
