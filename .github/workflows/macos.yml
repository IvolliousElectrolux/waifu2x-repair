name: macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "挂到已有 Release 的标签; 留空只上传 artifact"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: macos-arm64
            pdfium: mac-arm64
          - target: x86_64-apple-darwin
            asset: macos-x64
            pdfium: mac-x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.asset }}
          cache-all-crates: true
          cache-provider: github
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      # Microsoft 在 1.23.2 后不再提供 osx-x86_64; pykeio/ort 因此也没有该 target 的预编译.
      - name: Cache Intel Mac ONNX Runtime
        if: matrix.target == 'x86_64-apple-darwin'
        id: cache-ort-x64
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ort-osx-x64
          key: onnxruntime-osx-x86_64-1.23.2

      - name: Fetch Intel Mac ONNX Runtime
        if: matrix.target == 'x86_64-apple-darwin' && steps.cache-ort-x64.outputs.cache-hit != 'true'
        env:
          ORT_VER: "1.23.2"
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/ort-osx-x64"
          mkdir -p "$DEST"
          curl -fsSL -o "$DEST/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-osx-x86_64-${ORT_VER}.tgz"
          tar -xzf "$DEST/ort.tgz" -C "$DEST"
          rm -f "$DEST/ort.tgz"

      - name: Build
        run: cargo build -r --target ${{ matrix.target }}

      - name: Bundle pdfium + onnxruntime
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          STAGE="waifu2x_repair-${VER}-${{ matrix.asset }}"
          BIN="target/${{ matrix.target }}/release/waifu2x_repair"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          chmod +x "$STAGE/waifu2x_repair"

          curl -fsSL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F6406/pdfium-${{ matrix.pdfium }}.tgz"
          mkdir -p pdfium-extract
          tar -xzf pdfium.tgz -C pdfium-extract
          DYLIB=$(find pdfium-extract -name 'libpdfium.dylib' | head -n 1)
          test -n "$DYLIB"
          cp "$DYLIB" "$STAGE/libpdfium.dylib"

          # arm64: ort copy-dylibs; x64: Microsoft 1.23.2 (最后一版官方 Intel Mac)
          find "target/${{ matrix.target }}/release" -maxdepth 1 \( -name 'libonnxruntime*.dylib' -o -name 'libonnxruntime*' \) -exec cp {} "$STAGE/" \; || true
          find "target/${{ matrix.target }}/release/deps" -maxdepth 1 -name 'libonnxruntime*.dylib' -exec cp {} "$STAGE/" \; || true
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            ORT_DY=$(find "${RUNNER_TEMP}/ort-osx-x64" -name 'libonnxruntime.dylib' | head -n 1)
            test -n "$ORT_DY"
            cp -L "$ORT_DY" "$STAGE/libonnxruntime.dylib"
            find "$(dirname "$ORT_DY")" -name 'libonnxruntime*.dylib' -exec cp -L {} "$STAGE/" \;
          fi

          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "${STAGE}.zip"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          ls -lh "${STAGE}.zip" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: ${{ env.STAGE }}.zip

      - name: Attach zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG=""
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "no release tag; skip attach"
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "waifu2x repair ${TAG}"
          fi
          gh release upload "$TAG" "${STAGE}.zip" --clobber
